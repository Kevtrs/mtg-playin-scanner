name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Préparer le moteur CollectorVision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Versions fixées : modifier ces valeurs pour mettre à jour le moteur.
          CV_COMMIT=2a122d00d25c8d112a90e47bf235a021e0c53b0c
          CV_ASSETS_SHA256=6138910aedad5108c40bd0f2afffaef216326474594b53c128ad4e9cc158eb97
          git clone https://github.com/HanClinto/CollectorVision.git /tmp/collectorvision
          git -C /tmp/collectorvision checkout --detach "$CV_COMMIT"
          mkdir -p dist/cv
          cp -r /tmp/collectorvision/examples/web_scanner/lib dist/cv/
          cp /tmp/collectorvision/examples/web_scanner/scanner.worker.mjs dist/cv/
          cp /tmp/collectorvision/LICENSE dist/cv/COLLECTORVISION-LICENSE
          mkdir -p /tmp/cv-assets
          gh release download web-scanner-assets \
            --repo HanClinto/CollectorVision \
            --pattern "web-scanner-assets.tar.zst" \
            --dir /tmp/cv-assets
          echo "$CV_ASSETS_SHA256  /tmp/cv-assets/web-scanner-assets.tar.zst" | sha256sum -c -
          tar --zstd -xf /tmp/cv-assets/web-scanner-assets.tar.zst -C dist/cv assets vendor bundle-metadata.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
