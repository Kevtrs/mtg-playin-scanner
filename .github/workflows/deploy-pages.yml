name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Préparer le moteur CollectorVision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 https://github.com/HanClinto/CollectorVision.git /tmp/collectorvision
          mkdir -p dist/cv
          cp -r /tmp/collectorvision/examples/web_scanner/lib dist/cv/
          cp /tmp/collectorvision/examples/web_scanner/scanner.worker.mjs dist/cv/
          cp /tmp/collectorvision/LICENSE dist/cv/COLLECTORVISION-LICENSE
          mkdir -p /tmp/cv-assets
          gh release download web-scanner-assets \
            --repo HanClinto/CollectorVision \
            --pattern "web-scanner-assets.tar.zst" \
            --dir /tmp/cv-assets
          tar --zstd -xf /tmp/cv-assets/web-scanner-assets.tar.zst -C dist/cv assets vendor bundle-metadata.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
